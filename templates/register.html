<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · 家庭点菜</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% import "_icons.html" as ic %}
    <div class="landing">
        <div class="landing-head">
            <div class="mark">{{ ic.icon("bowl", 32) }}</div>
            <h1>注册新家庭</h1>
            <p>给你家建一个账号，数据只有你家能看到</p>
        </div>

        <div class="role-cards">
            <form class="card" action="/register" method="post">
                {% if error %}<p class="alert" style="margin-top:0;">{{ error }}</p>{% endif %}
                <label class="field-label">账号（起个名字，比如 li-jia）</label>
                <input type="text" name="username" autocomplete="username" required autofocus>
                <label class="field-label">密码（至少 4 位）</label>
                <input type="password" name="password" autocomplete="new-password" required>
                <div style="margin-top:16px;">
                    <button class="btn-primary btn-block" type="submit">注册并进入</button>
                </div>
                <p class="hint" style="text-align:center; margin-top:14px;">
                    已经有账号？<a href="/login">去登录</a>
                </p>
            </form>
        </div>

        <p class="landing-tip">记好账号密码，给家人和菲佣用同一个账号登录</p>
    </div>
</body>
</html>
