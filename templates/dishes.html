<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理菜品 · 妈妈</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="role-mom">
    <div class="appbar">
        <div class="appbar-inner">
            <h1>👩 妈妈 · 管理菜品</h1>
            <a class="home-link" href="/">🏠 首页</a>
        </div>
    </div>

    <nav class="tabnav">
        <a href="/order">点餐</a>
        <a href="/plans">未来菜单</a>
        <a class="active" href="/dishes">管理菜品</a>
    </nav>

    <div class="container">
        <div class="card" id="delete-section">
            <h2>🗂️ 删除已保存的菜</h2>
            <p class="section-hint">删除一个菜，会同时删掉它在所有菜单里的记录。</p>

            <form action="/dishes" method="get" style="margin-bottom:16px;">
                <input type="text" name="search" value="{{ search_query }}" placeholder="搜索要删除的菜，例如：米饭">
                <div style="margin-top:10px;">
                    <button class="btn-primary btn-sm" type="submit">搜索</button>
                </div>
            </form>

            {% if filtered_dishes %}
                {% for dish in filtered_dishes %}
                <div class="delete-item">
                    <div>
                        <strong>{{ dish['name_zh'] }}</strong>
                        <div class="en">{{ dish['name_en'] }}</div>
                    </div>
                    <form action="/delete_dish" method="post" onsubmit="return confirm('确定删除这个菜吗？');">
                        <input type="hidden" name="dish_id" value="{{ dish['id'] }}">
                        <input type="hidden" name="search" value="{{ search_query }}">
                        <button class="btn-danger btn-sm" type="submit">删除</button>
                    </form>
                </div>
                {% endfor %}
            {% else %}
                <p class="empty">没有找到匹配的菜。</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
