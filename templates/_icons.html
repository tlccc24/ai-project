{# Reusable line-icon set (Lucide-style). Usage:
   {% import "_icons.html" as ic %}  then  {{ ic.icon("home") }}
   Color follows currentColor; size via CSS (.ic) or the size arg. #}
{% macro icon(name, size=20) -%}
<svg class="ic" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true">
{%- if name == "home" -%}
<path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/>
{%- elif name == "order" -%}
<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
{%- elif name == "calendar" -%}
<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 9.5h18"/>
{%- elif name == "list" -%}
<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r=".8"/><circle cx="3.5" cy="12" r=".8"/><circle cx="3.5" cy="18" r=".8"/>
{%- elif name == "fridge" -%}
<rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M5 10h14"/><path d="M9 6v1.5"/><path d="M9 13v2.5"/>
{%- elif name == "chef" -%}
<path d="M6 13.9A4 4 0 0 1 7.4 6a5 5 0 0 1 9.2 0A4 4 0 0 1 18 13.9V20H6Z"/><path d="M6 17h12"/>
{%- elif name == "sparkles" -%}
<path d="M12 3l1.7 5L19 9.7 13.7 11.4 12 17l-1.7-5.6L5 9.7l5.3-1.7Z"/><path d="M19 14l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7Z"/>
{%- elif name == "cart" -%}
<circle cx="9" cy="20" r="1.3"/><circle cx="19" cy="20" r="1.3"/><path d="M2.5 3h2.2l2.2 11.3a1.6 1.6 0 0 0 1.6 1.3h9.1a1.6 1.6 0 0 0 1.6-1.3L21.5 7H6"/>
{%- elif name == "clock" -%}
<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>
{%- elif name == "trash" -%}
<path d="M3.5 6h17M9 6V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V6m3 0v13.5A1.5 1.5 0 0 1 16.5 21h-9A1.5 1.5 0 0 1 6 19.5V6"/>
{%- elif name == "plus" -%}
<path d="M12 5v14M5 12h14"/>
{%- elif name == "search" -%}
<circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/>
{%- elif name == "user" -%}
<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
{%- elif name == "bowl" -%}
<path d="M3 11h18"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 3c1.5 1 1.5 2.5 0 3.5"/>
{%- elif name == "check" -%}
<path d="m20 6-11 11-5-5"/>
{%- elif name == "x" -%}
<path d="M18 6 6 18M6 6l12 12"/>
{%- elif name == "sunrise" -%}
<path d="M17 18a5 5 0 0 0-10 0"/><path d="M12 2v7M5.6 11.6 4.2 10.2M18.4 11.6l1.4-1.4M2 18h2M20 18h2M23 22H1"/><path d="m8 6 4-4 4 4"/>
{%- elif name == "sun" -%}
<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>
{%- elif name == "moon" -%}
<path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/>
{%- elif name == "arrow-right" -%}
<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == "arrow-left" -%}
<path d="M19 12H5M11 18l-6-6 6-6"/>
{%- elif name == "play" -%}
<circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/>
{%- else -%}
<circle cx="12" cy="12" r="9"/>
{%- endif -%}
</svg>
{%- endmacro %}
