<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭点菜</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="landing">
        <div class="landing-head">
            <div class="logo">🍽️</div>
            <h1>家庭点菜</h1>
            <p>请选择你的身份 · Choose who you are</p>
        </div>

        <div class="role-cards">
            <a class="role-card mom" href="/order">
                <span class="emoji">👩</span>
                <span class="role-text">
                    <strong>我要点菜</strong>
                    <span>妈妈 · 点餐、未来菜单、AI 推荐</span>
                </span>
            </a>

            <a class="role-card cook" href="/dashboard?lang=zh">
                <span class="emoji">👩‍🍳</span>
                <span class="role-text">
                    <strong>我要做饭</strong>
                    <span>佣人 · 看菜单、冰箱库存 (中文/English)</span>
                </span>
            </a>
        </div>

        <div class="tip-row">
            <span class="tip">把这个网址加到手机主屏幕，用起来就像 App 一样。</span>
        </div>
    </div>
</body>
</html>
