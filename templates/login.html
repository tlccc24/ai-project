<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 家庭点菜</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% import "_icons.html" as ic %}
    <div class="landing">
        <div class="landing-head">
            <div class="mark">{{ ic.icon("bowl", 32) }}</div>
            <h1>家庭点菜</h1>
            <p>登录你家的账号</p>
        </div>

        <div class="role-cards">
            <form class="card" action="/login" method="post">
                {% if error %}<p class="alert" style="margin-top:0;">{{ error }}</p>{% endif %}
                <label class="field-label">账号</label>
                <input type="text" name="username" autocomplete="username" required autofocus>
                <label class="field-label">密码</label>
                <input type="password" name="password" autocomplete="current-password" required>
                <div style="margin-top:16px;">
                    <button class="btn-primary btn-block" type="submit">登录</button>
                </div>
                <p class="hint" style="text-align:center; margin-top:14px;">
                    还没有账号？<a href="/register">注册一个</a>
                </p>
            </form>
        </div>

        <p class="landing-tip">登录一次后，这台设备下次会自动进入</p>
    </div>
</body>
</html>
